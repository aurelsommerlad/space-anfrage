<!--
  SPACE im HØV – kompakte Anfrageleiste (Widget A), Version 7
  Einfügen in ein Elementor-Widget "HTML". Darf mehrfach auf einer Seite stehen.
  Die Leiste ist reines HTML/CSS und immer sichtbar. Der Kalender kommt als
  Datei von der App (letzte Zeile) – WordPress kann den Code so nicht verändern.
  Einstellungen im <form>: action = Adresse der Formularseite,
  data-header-offset = Höhe eines fixierten Website-Headers in px.
  Übergeben werden nur beginn, ende und personen – keine personenbezogenen Daten.
-->
<form class="sa-leiste" data-sa-leiste action="/space-anfrage/" data-header-offset="100" method="get" novalidate>
  <div class="sa-leiste__row">
    <button type="button" class="sa-leiste__date" aria-haspopup="dialog" aria-expanded="false" aria-label="Datum oder Zeitraum">
      <span class="sa-leiste__placeholder" aria-hidden="true">Datum / Zeitraum</span>
      <span class="sa-leiste__value" aria-hidden="true"></span>
      <svg class="sa-leiste__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="4" width="15" height="13.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 8h15M6.5 2.2v3.4M13.5 2.2v3.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <label class="sa-leiste__guests">
      <span class="sa-leiste__sr">Personen</span>
      <input class="sa-leiste__input" name="personen" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="Personen">
    </label>
    <button type="submit" class="sa-leiste__submit" aria-label="Verfügbarkeit prüfen">
      <svg class="sa-leiste__arrow" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><path d="M4 11h13.5M12 5.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
  <p class="sa-leiste__error" data-sa-error="date" aria-live="polite"></p>
  <p class="sa-leiste__error" data-sa-error="guests" aria-live="polite"></p>
</form>

<style>
  /* Nur die Anfrageleiste. Dreifache Klasse + !important: setzt sich gegen
     Theme- und Elementor-Formularstile durch, ohne andere Elemente zu berühren. */
  .sa-leiste.sa-leiste.sa-leiste,
  .sa-leiste.sa-leiste.sa-leiste * {
    box-sizing: border-box !important;
    transition: none !important;
    animation: none !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    text-shadow: none !important;
    float: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste div,
  .sa-leiste.sa-leiste.sa-leiste p,
  .sa-leiste.sa-leiste.sa-leiste label,
  .sa-leiste.sa-leiste.sa-leiste span {
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    background: transparent !important;
    color: #1e1e1e !important;
    font-family: inherit !important;
    font-size: 16px !important;
    line-height: 1.4 !important;
    text-align: left !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__row {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) clamp(120px, 24%, 200px) 60px !important;
    gap: 10px !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input {
    -webkit-appearance: none !important;
    appearance: none !important;
    display: flex !important;
    align-items: center !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    height: 60px !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 18px !important;
    background: #ffffff !important;
    border: 1px solid #dcdcdc !important;
    border-radius: 2px !important;
    box-shadow: none !important;
    outline: none !important;
    color: #1e1e1e !important;
    font-family: inherit !important;
    font-size: 16px !important;
    font-style: normal !important;
    font-weight: 400 !important;
    line-height: normal !important;
    text-decoration: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date {
    gap: 12px !important;
    justify-content: space-between !important;
    text-align: left !important;
    white-space: nowrap !important;
    cursor: pointer !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date * {
    pointer-events: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input {
    display: block !important;
    cursor: text !important;
  }
  @media (hover: hover) {
    .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date:hover,
    .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input:hover {
      background: #ffffff !important;
      border-color: #a8a8a8 !important;
      color: #1e1e1e !important;
    }
  }
  /* Fokus allein (z. B. nach "Übernehmen") ist kein aktiver Zustand:
     Rahmen bleibt hellgrau wie im Ruhezustand. */
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date:focus,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input:focus {
    background: #ffffff !important;
    border: 1px solid #dcdcdc !important;
    box-shadow: none !important;
    outline: none !important;
    color: #1e1e1e !important;
  }
  /* Aktiv: Kalender offen bzw. Eingabe im Personenfeld – dünner, dunklerer Rahmen */
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date[aria-expanded="true"],
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input:focus {
    border-color: #8c8c8c !important;
  }
  /* Tastatur: klar sichtbarer Fokus */
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date:focus-visible,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__submit:focus-visible,
  .sa-leiste.sa-leiste.sa-leiste[data-sa-modality="keyboard"] .sa-leiste__input:focus {
    outline: 2px solid #1e1e1e !important;
    outline-offset: 2px !important;
    border-color: #1e1e1e !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date[aria-invalid="true"],
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input[aria-invalid="true"] {
    border-color: #b42318 !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__placeholder,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__value {
    display: block !important;
    min-width: 0 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    font: inherit !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__placeholder,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__input::placeholder {
    color: #6b6b6b !important;
    opacity: 1 !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__value:empty,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date[data-filled] .sa-leiste__placeholder {
    display: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__icon,
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__arrow {
    display: block !important;
    flex: none !important;
    max-width: none !important;
    fill: none !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__icon {
    width: 20px !important;
    height: 20px !important;
    margin-left: auto !important;
    color: #1e1e1e !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__arrow {
    width: 22px !important;
    height: 22px !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__guests {
    position: relative !important;
    display: block !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    color: inherit !important;
    font: inherit !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__sr {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    margin: -1px !important;
    padding: 0 !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__submit {
    -webkit-appearance: none !important;
    appearance: none !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 60px !important;
    min-width: 0 !important;
    height: 60px !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #1e1e1e !important;
    border: 1px solid #1e1e1e !important;
    border-radius: 2px !important;
    box-shadow: none !important;
    outline: none !important;
    color: #ffffff !important;
    cursor: pointer !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__submit:focus {
    background: #1e1e1e !important;
    border-color: #1e1e1e !important;
    color: #ffffff !important;
  }
  @media (hover: hover) {
    .sa-leiste.sa-leiste.sa-leiste .sa-leiste__submit:hover {
      background: #3a3a3a !important;
      border-color: #3a3a3a !important;
      color: #ffffff !important;
    }
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__error {
    margin: 8px 0 0 !important;
    padding: 0 !important;
    font-family: inherit !important;
    font-size: 14px !important;
    line-height: 1.4 !important;
    color: #b42318 !important;
  }
  .sa-leiste.sa-leiste.sa-leiste .sa-leiste__error:empty {
    display: none !important;
  }
  @media (max-width: 599px) {
    .sa-leiste.sa-leiste.sa-leiste .sa-leiste__row {
      grid-template-columns: minmax(0, 1fr) 60px !important;
    }
    .sa-leiste.sa-leiste.sa-leiste .sa-leiste__date {
      grid-column: 1 / -1 !important;
    }
  }
</style>

<script src="https://space-anfrage.vercel.app/anfrageleiste.js?v=7" defer></script>
